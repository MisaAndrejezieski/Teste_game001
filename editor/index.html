<div id="layers-block">
  <div class="layer-row" data-idx="0">
    <span>Fundo distante</span>
    <select id="layer-0-img"></select>
    <input type="number" id="layer-0-speed" step="0.1" min="0" max="5" />
    <button class="btn-clear-layer" data-idx="0" title="Limpar camada">✕</button>
  </div>
  <div class="layer-row" data-idx="1">
    <span>Meio</span>
    <select id="layer-1-img"></select>
    <input type="number" id="layer-1-speed" step="0.1" min="0" max="5" />
    <button class="btn-clear-layer" data-idx="1" title="Limpar camada">✕</button>
  </div>
  <div class="layer-row" data-idx="2">
    <span>Frente</span>
    <select id="layer-2-img"></select>
    <input type="number" id="layer-2-speed" step="0.1" min="0" max="5" />
    <button class="btn-clear-layer" data-idx="2" title="Limpar camada">✕</button>
  </div>
  <button class="btn-action btn-red" style="margin-top:8px;" onclick="removeAllLayers()">🗑️ Limpar todas as camadas</button>
</div>
