<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player — Anime Game Studio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-stage">
    <div id="parallax-stage">
      <div class="parallax-layer" data-layer="0"></div>
      <div class="parallax-layer" data-layer="1"></div>
      <div class="parallax-layer" data-layer="2"></div>
    </div>
    <div id="background-layer"></div>

    <div id="ground-line"></div>
    <div id="entities-container"></div>

    <div id="hud">
      <span id="hud-title">Jogo</span>
      <span id="hud-lives"></span>
      <span id="hud-score">PONTOS: 0</span>
      <span id="hud-best">RECORDE: 0</span>
      <button id="btn-exit" onclick="exitGame()">⏹ Sair (Esc)</button>
      <button id="btn-edit" onclick="exitGame()">✎ Editar</button>
    </div>

    <div id="game-over" class="hidden">
      <h1>GAME OVER</h1>
      <p id="game-over-score">PONTOS: 0</p>
      <button onclick="restartGame()">Jogar novamente</button>
      <button onclick="exitGame()">Sair</button>
    </div>
  </div>

  <script src="../shared/schema.js"></script>
  <script src="../shared/storage.js"></script>
  <script src="player.js"></script>
</body>
</html>
