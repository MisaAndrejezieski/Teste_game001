<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ajuste de Proporções - Slot Anime</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #121214;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Palco do Jogo */
    #game-stage {
      flex: 1;
      position: relative;
      background: linear-gradient(180deg, #2a1b4e 0%, #110927 100%);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      overflow: hidden;
    }

    #ground-line {
      position: absolute;
      bottom: 80px;
      left: 0;
      width: 100%;
      height: 4px;
      background: #ff4081;
      box-shadow: 0 0 10px #ff4081;
      z-index: 1;
    }

    .sprite-container {
      position: absolute;
      bottom: 80px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      z-index: 2;
    }

    #buro-container {
      left: 20%;
    }

    #enemy-container {
      right: 20%;
    }

    .sprite-container img {
      display: block;
      max-width: none;
      transform-origin: bottom center;
    }

    /* Painel de Controles */
    #control-panel {
      width: 380px;
      background: #1e1e24;
      border-left: 2px solid #32323d;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    h2 {
      font-size: 1.2rem;
      color: #ff4081;
      border-bottom: 1px solid #32323d;
      padding-bottom: 8px;
    }

    .control-group {
      background: #282830;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #383845;
    }

    .control-group h3 {
      font-size: 0.95rem;
      margin-bottom: 10px;
      color: #00e5ff;
    }

    .field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 0.85rem;
    }

    .field label {
      flex: 1;
    }

    .field input[type="range"] {
      flex: 1.5;
      margin: 0 8px;
    }

    .field span {
      width: 50px;
      text-align: right;
      font-family: monospace;
      color: #ffeb3b;
    }

    .active-info {
      font-size: 0.8rem;
      color: #00e5ff;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 5px;
    }

    button {
      background: #3f51b5;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.8rem;
      transition: background 0.2s;
    }

    button:hover {
      background: #5c6bc0;
    }

    #export-btn {
      background: #4caf50;
      padding: 12px;
      font-size: 0.9rem;
      margin-top: auto;
    }

    #export-btn:hover {
      background: #66bb6a;
    }
  </style>
</head>
<body>

  <div id="game-stage">
    <div id="ground-line"></div>

    <div id="buro-container" class="sprite-container">
      <img id="buro-img" src="images/muse-dash-buro_anda_normal.gif" alt="Buro" />
    </div>

    <div id="enemy-container" class="sprite-container">
      <img id="enemy-img" src="images/inimiga_caminha.gif" alt="Inimiga" />
    </div>
  </div>

  <div id="control-panel">
    <h2>Ajustes de Proporção</h2>

    <!-- Ações da Buro -->
    <div class="control-group">
      <h3>Testar Buro</h3>
      <div class="btn-grid">
        <button onclick="testBuro('run_normal')">Corrida Normal</button>
        <button onclick="testBuro('run_10s')">Corrida 10s</button>
        <button onclick="testBuro('jump_normal')">Pulo Normal</button>
        <button onclick="testBuro('jump_special')">Pulo Especial</button>
        <button onclick="testBuro('bump')">Esbarrão</button>
        <button onclick="testBuro('victory')">Vitória</button>
        <button onclick="testBuro('defeat')">Morte (Marija)</button>
        <button onclick="testBuro('menu')">Menu Principal</button>
      </div>
    </div>

    <!-- Ações da Inimiga -->
    <div class="control-group">
      <h3>Testar Inimiga</h3>
      <div class="btn-grid">
        <button onclick="testEnemy('walk')">Caminhada</button>
        <button onclick="testEnemy('bump')">Esbarrão</button>
        <button onclick="testEnemy('pass')">Passou Direto</button>
        <button onclick="testEnemy('kill')">Ataque / Vitória (inim004)</button>
      </div>
    </div>

    <!-- Ajuste do Sprite Selecionado -->
    <div class="control-group">
      <h3>Ajuste do Sprite Ativo</h3>
      <div id="active-sprite-name" class="active-info">Editando: muse-dash-buro_anda_normal.gif</div>
      <div class="field">
        <label>Escala (Tamanho):</label>
        <input type="range" id="active-scale" min="0.1" max="3" step="0.05" value="1" oninput="updateActiveSprite('scale', this.value)" />
        <span id="v-active-scale">1.00</span>
      </div>
      <div class="field">
        <label>Ajuste de Chão (Y):</label>
        <input type="range" id="active-offset-y" min="-150" max="150" value="0" oninput="updateActiveSprite('offsetY', this.value)" />
        <span id="v-active-offset-y">0px</span>
      </div>
    </div>

    <button id="export-btn" onclick="exportConfig()">Copiar Configurações Finalizadas</button>
  </div>

  <script>
    const ASSETS = {
      buro: {
        menu: 'images/muse-dash-buro_tela principal.gif',
        runNormal: 'images/muse-dash-buro_anda_normal.gif',
        run10s: 'images/muse-dash-buro_andar_depois_de_10s.gif',
        jumpNormal: 'images/muse-dash-buro_segunda_imagem_do_pulo_normal.gif',
        jumpSpecial: 'images/muse-dash-buro_segunda_imagem_do_pulo_especial.gif',
        bump: 'images/muse-dash-buro_segunda_imagem_do_esbarrao.gif',
        victory: 'images/muse-dash-buro_chega_na_linha_de_vitoria.gif',
        defeat: 'images/muse-dash-marija_morte.gif'
      },
      enemy: {
        walk: 'images/inimiga_caminha.gif',
        bump: 'images/inimiga_esbarra_na_principal.gif',
        pass: 'images/inimiga_passa_da_principal.gif',
        kill: 'images/inim004.gif'
      }
    };

    const defaultConfig = {
      "timings": {
        "jumpNormal": 400,
        "jumpSpecial": 500,
        "bump": 600
      },
      "sprites": {
        "images/muse-dash-buro_anda_normal.gif": { "scale": 0.9, "offsetY": -60 },
        "images/muse-dash-buro_andar_depois_de_10s.gif": { "scale": 0.8, "offsetY": -60 },
        "images/muse-dash-buro_primeira_imagem_do_pulo.gif": { "scale": 1, "offsetY": 0 },
        "images/muse-dash-buro_segunda_imagem_do_pulo_normal.gif": { "scale": 0.4, "offsetY": -150 },
        "images/muse-dash-buro_primeira_imagem_do_pulo_especial.gif": { "scale": 1, "offsetY": 0 },
        "images/muse-dash-buro_segunda_imagem_do_pulo_especial.gif": { "scale": 0.9, "offsetY": -60 },
        "images/muse-dash-buro_primeira_imagem_do_esbarrao.gif": { "scale": 1, "offsetY": 0 },
        "images/muse-dash-buro_segunda_imagem_do_esbarrao.gif": { "scale": 0.8, "offsetY": -60 },
        "images/muse-dash-buro_chega_na_linha_de_vitoria.gif": { "scale": 0.95, "offsetY": -60 },
        "images/muse-dash-buro_tela principal.gif": { "scale": 1, "offsetY": 0 },
        "images/muse-dash-marija_morte.gif": { "scale": 0.7, "offsetY": -60 },
        "images/inimiga_caminha.gif": { "scale": 0.35, "offsetY": -150 },
        "images/inimiga_esbarra_na_principal.gif": { "scale": 0.35, "offsetY": -150 },
        "images/inimiga_passa_da_principal.gif": { "scale": 0.35, "offsetY": -150 },
        "images/inim004.gif": { "scale": 0.35, "offsetY": -150 }
      }
    };

    const savedData = localStorage.getItem('slot_anime_config');
    const config = savedData ? JSON.parse(savedData) : defaultConfig;

    let activeSprite = ASSETS.buro.runNormal;
    let activeImgElement = null;

    const buroImg = document.getElementById('buro-img');
    const enemyImg = document.getElementById('enemy-img');

    function saveToLocalStorage() {
      localStorage.setItem('slot_anime_config', JSON.stringify(config));
    }

    function applySpriteStyle(imgElement, spriteName) {
      if (!config.sprites[spriteName]) {
        config.sprites[spriteName] = { scale: 1, offsetY: 0 };
      }
      const spriteConfig = config.sprites[spriteName];
      imgElement.src = spriteName;
      imgElement.style.transform = `scale(${spriteConfig.scale}) translateY(${-spriteConfig.offsetY}px)`;
    }

    function selectSpriteToEdit(spriteName, imgElement) {
      activeSprite = spriteName;
      activeImgElement = imgElement;
      document.getElementById('active-sprite-name').innerText = `Editando: ${spriteName.replace('images/', '')}`;
      
      const currentConfig = config.sprites[spriteName] || { scale: 1, offsetY: 0 };
      document.getElementById('active-scale').value = currentConfig.scale;
      document.getElementById('v-active-scale').innerText = Number(currentConfig.scale).toFixed(2);
      document.getElementById('active-offset-y').value = currentConfig.offsetY;
      document.getElementById('v-active-offset-y').innerText = currentConfig.offsetY + 'px';
    }

    function updateActiveSprite(prop, value) {
      if (!activeSprite || !activeImgElement) return;
      config.sprites[activeSprite][prop] = parseFloat(value);
      applySpriteStyle(activeImgElement, activeSprite);
      
      if (prop === 'scale') {
        document.getElementById('v-active-scale').innerText = Number(value).toFixed(2);
      } else if (prop === 'offsetY') {
        document.getElementById('v-active-offset-y').innerText = value + 'px';
      }
      
      saveToLocalStorage();
    }

    function testBuro(action) {
      if (action === 'run_normal') selectSpriteToEdit(ASSETS.buro.runNormal, buroImg);
      else if (action === 'run_10s') selectSpriteToEdit(ASSETS.buro.run10s, buroImg);
      else if (action === 'jump_normal') selectSpriteToEdit(ASSETS.buro.jumpNormal, buroImg);
      else if (action === 'jump_special') selectSpriteToEdit(ASSETS.buro.jumpSpecial, buroImg);
      else if (action === 'bump') selectSpriteToEdit(ASSETS.buro.bump, buroImg);
      else if (action === 'victory') selectSpriteToEdit(ASSETS.buro.victory, buroImg);
      else if (action === 'defeat') selectSpriteToEdit(ASSETS.buro.defeat, buroImg);
      else if (action === 'menu') selectSpriteToEdit(ASSETS.buro.menu, buroImg);

      applySpriteStyle(buroImg, activeSprite);
    }

    function testEnemy(action) {
      if (action === 'walk') selectSpriteToEdit(ASSETS.enemy.walk, enemyImg);
      else if (action === 'bump') selectSpriteToEdit(ASSETS.enemy.bump, enemyImg);
      else if (action === 'pass') selectSpriteToEdit(ASSETS.enemy.pass, enemyImg);
      else if (action === 'kill') selectSpriteToEdit(ASSETS.enemy.kill, enemyImg);

      applySpriteStyle(enemyImg, activeSprite);
    }

    function exportConfig() {
      const output = JSON.stringify(config, null, 2);
      navigator.clipboard.writeText(output);
      alert('Configurações copiadas para a área de transferência!');
    }

    window.addEventListener('DOMContentLoaded', () => {
      applySpriteStyle(buroImg, ASSETS.buro.runNormal);
      applySpriteStyle(enemyImg, ASSETS.enemy.walk);
      selectSpriteToEdit(ASSETS.buro.runNormal, buroImg);
    });
  </script>
</body>
</html>
