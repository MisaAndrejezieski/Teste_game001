<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anime Game Studio - Criador de Jogos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Palco / Canvas de Renderização do Jogo -->
  <div id="game-stage">
    <div id="ground-line"></div>
    <div id="entities-container"></div>
  </div>

  <!-- Painel de Controle e Criação -->
  <div id="control-panel">
    <h2>Anime Game Studio</h2>

    <!-- Gerenciamento de Projetos e Modos de Jogo -->
    <div class="control-group">
      <h3>1. Configurações do Jogo</h3>
      <div class="field">
        <label>Nome do Jogo:</label>
        <input type="text" id="game-title" value="Meu Jogo Anime" onchange="updateGameMeta('title', this.value)" />
      </div>
      <div class="field">
        <label>Estilo de Jogo:</label>
        <select id="game-genre" onchange="updateGameMeta('genre', this.value)">
          <option value="runner">Runner (Estilo Dino Google)</option>
          <option value="fighting">Luta 2D</option>
          <option value="racing">Corrida / Obstáculos</option>
        </select>
      </div>
    </div>

    <!-- Seletor de Entidades (Personagens / Inimigos / Objetos) -->
    <div class="control-group">
      <h3>2. Entidades & Personagens</h3>
      <div class="field">
        <label>Selecionar:</label>
        <select id="entity-selector" onchange="selectEntity(this.value)"></select>
      </div>
      <div class="field">
        <label>Novo ID/Nome:</label>
        <input type="text" id="new-entity-id" placeholder="ex: chefao_fase1" />
      </div>
      <button class="btn-action btn-blue" onclick="createEntity()">+ Criar Entidade</button>
    </div>

    <!-- Regras e Físicas por Entidade -->
    <div class="control-group">
      <h3>3. Propriedades & Físicas</h3>
      <div class="field">
        <label>Papel no Jogo:</label>
        <select id="prop-role" onchange="updateEntityProp('role', this.value)">
          <option value="player">Jogador Principal</option>
          <option value="enemy">Inimigo / Obstáculo</option>
          <option value="prop">Objeto / Cenário</option>
        </select>
      </div>
      <div class="field">
        <label>Camada (Z-Index):</label>
        <select id="prop-layer" onchange="updateEntityProp('layer', this.value)">
          <option value="foreground">Na Frente (Foreground)</option>
          <option value="ground">No Chão (Main Stage)</option>
          <option value="background">Atrás (Background)</option>
        </select>
      </div>
      <div class="checkbox-field">
        <input type="checkbox" id="prop-density" onchange="updateEntityProp('hasDensity', this.checked)" />
        <label for="prop-density">Possui colisão/corpo sólido</label>
      </div>
      <div class="field">
        <label>Chances/Vidas:</label>
        <input type="number" id="prop-lives" min="0" max="99" onchange="updateEntityProp('extraLives', parseInt(this.value))" />
      </div>
      <div class="field">
        <label>Velocidade / Força:</label>
        <input type="number" id="prop-speed" min="0" max="1000" onchange="updateEntityProp('speed', parseInt(this.value))" />
      </div>
      <div class="field">
        <label>Força Pulo (px):</label>
        <input type="number" id="prop-jump" min="0" max="500" onchange="updateEntityProp('jumpHeight', parseInt(this.value))" />
      </div>
      <div class="field">
        <label>Tempo Flutuação (ms):</label>
        <input type="number" id="prop-float" min="0" max="10000" step="100" onchange="updateEntityProp('floatTime', parseInt(this.value))" />
      </div>
    </div>

    <!-- Vínculo de GIFs por Ação -->
    <div class="control-group">
      <h3>4. GIFs de Animações</h3>
      <div class="field">
        <label>Parado / Base:</label>
        <input type="text" id="gif-idle" onchange="updateEntityGif('idle', this.value)" placeholder="images/..." />
      </div>
      <div class="field">
        <label>Correr / Mover:</label>
        <input type="text" id="gif-run" onchange="updateEntityGif('run', this.value)" placeholder="images/..." />
      </div>
      <div class="field">
        <label>Pular:</label>
        <input type="text" id="gif-jump" onchange="updateEntityGif('jump', this.value)" placeholder="images/..." />
      </div>
      <div class="field">
        <label>Ataque / Especial:</label>
        <input type="text" id="gif-attack" onchange="updateEntityGif('attack', this.value)" placeholder="images/..." />
      </div>
      <div class="field">
        <label>Dano / Esbarrão:</label>
        <input type="text" id="gif-bump" onchange="updateEntityGif('bump', this.value)" placeholder="images/..." />
      </div>
      <div class="field">
        <label>Morte / Derrota:</label>
        <input type="text" id="gif-defeat" onchange="updateEntityGif('defeat', this.value)" placeholder="images/..." />
      </div>
    </div>

    <!-- Salvar e Carregar Arquivo de Jogo (.json) -->
    <div class="control-group">
      <h3>5. Salvar / Carregar Projeto</h3>
      <button class="btn-action btn-green" onclick="downloadGameFile()">💾 Baixar Arquivo do Jogo (.json)</button>
      <input type="file" id="import-file" accept=".json" style="display: none;" onchange="loadGameFile(event)" />
      <button class="btn-action btn-orange" onclick="document.getElementById('import-file').click()">📂 Carregar Arquivo de Jogo</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
