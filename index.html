<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Runner Infinite - Muse Dash Edition</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #191423;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    #gameArea {
      position: relative;
      width: 960px;
      height: 540px;
      background-color: #191423;
      border: 2px solid #b45078;
      box-shadow: 0 0 20px rgba(180, 80, 120, 0.4);
      overflow: hidden;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 10;
    }

    .sprite {
      position: absolute;
      pointer-events: none;
      z-index: 5;
    }

    /* Tamanho padrão das animações normais da jogadora */
    #buroSprite {
      width: 105px;
      height: 105px;
      object-fit: contain;
      transform: translate(-50%, -100%);
    }

    /* Classe especial aplicada dinamicamente quando ela morre */
    #buroSprite.morte {
      width: 110px;
      height: 110px;
    }

    .inimigaSprite {
      width: 65px;
      height: 65px;
      object-fit: contain;
      transform: scaleX(-1) translate(50%, -100%);
    }

    #menuSprite {
      position: absolute;
      left: 50%;
      top: 45%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      object-fit: contain;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div id="gameArea">
    <img id="menuSprite" src="images/muse-dash-buro.gif" style="display: block;">
    <img id="buroSprite" class="sprite" src="images/muse-dash-buro001.gif" style="display: none;">
    <div id="inimigasContainer"></div>
    <canvas id="gameCanvas" width="960" height="540"></canvas>
  </div>

  <script src="script.js"></script>
</body>
</html>
